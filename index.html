<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말문 영어회화</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말문">
<meta name="theme-color" content="#F6F4FD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Layout: one centered study column (max 560px). Index-card surface for every sentence, sticky top bar, fixed bottom tab bar.
   Palette: a deliberately light-only pastel look (lavender ground, mint/peach/pink/sky accents) chosen at the user's request. */
:root{
  --bg:#F6F4FD; --paper:#FFFFFF; --ink:#2A2D45; --muted:#6C7090; --line:#E5E2F4;
  --rule:rgba(140,128,225,.12); --margin:#F2A3B6;
  --accent:#5961D6; --accent-ink:#FFFFFF; --accent-soft:#ECEBFF;
  --good:#2C8760; --good-soft:#DFF5EA; --warn:#9C6318; --warn-soft:#FFF0DC; --bad:#BF4A5C; --bad-soft:#FFE6EA;
  --p-lav:#EEEAFE; --p-mint:#E2F6EE; --p-peach:#FFEEDF; --p-pink:#FFE9F0; --p-sky:#E3F1FE; --p-lemon:#FFF7D9;
  --shadow:0 1px 0 rgba(89,97,214,.05),0 12px 26px -16px rgba(89,97,214,.38);
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Charis SIL","Doulos SIL","Noto Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.brand b{color:var(--accent)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--good)}
.lv{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);flex:none;padding:0}
.iconbtn svg{width:20px;height:20px}

main{padding-block:6px calc(100px + env(safe-area-inset-bottom,0px))}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 20px -16px rgba(89,97,214,.4);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}
.tab.on svg{background:var(--accent-soft);border-radius:10px;padding:2px;width:34px;height:26px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;font-variant-numeric:tabular-nums}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.small{font-size:12.5px;color:var(--muted)}
.busy{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);margin:0 0 10px}
.spin{width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14.5px;line-height:1.2;text-align:center}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{min-height:54px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* index card */
.icard{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.icard-h{display:flex;align-items:center;gap:8px;padding:11px 16px 9px;border-bottom:1.5px solid var(--margin);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.icard-h .tag{color:var(--ink);font-family:var(--f-ko);font-size:12.5px;letter-spacing:0;font-weight:600}
.icard-h .src{margin-left:auto;text-transform:uppercase}
.icard-b{padding:18px 16px 20px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 8px}
.ko{font-size:21px;font-weight:600;line-height:1.5;margin:0;text-wrap:balance;word-break:keep-all}
.think{font-size:13px;color:var(--muted);margin:12px 0 0}
.ans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.en{font-family:var(--f-en);font-size:23px;line-height:1.38;margin:0;text-wrap:pretty}
.ipa{font-family:var(--f-en);font-size:15.5px;color:var(--accent);margin:6px 0 0;word-break:break-word}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0;word-break:keep-all}
.alt{font-size:13.5px;margin:8px 0 0}
.alt em{font-family:var(--f-en);font-style:italic;font-size:15.5px}
.ans-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* word cards */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{position:relative;background:var(--p-lemon);border:1px solid transparent;border-radius:8px;padding:10px 44px 11px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.wcard .w{font-family:var(--f-en);font-size:17.5px;font-weight:700;line-height:1.3;word-break:break-word}
.wcard .wipa{font-family:var(--f-en);font-size:13px;color:var(--accent)}
.wcard .wpos{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.wcard .wko{font-size:13.5px;font-weight:500;word-break:keep-all}
.keep{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.75);display:grid;place-items:center;color:var(--muted);padding:0}
.keep svg{width:17px;height:17px}
.keep.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.keep.on svg{fill:currentColor}

/* rating */
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate.two{grid-template-columns:repeat(2,1fr)}
.rate .btn{flex-direction:column;gap:1px;min-height:58px;border-color:transparent}
.rate .btn small{font-weight:500;font-size:11.5px;opacity:.85}
.r-hard{background:var(--p-pink);color:var(--bad)}
.r-mid{background:var(--p-peach);color:var(--warn)}
.r-good{background:var(--p-mint);color:var(--good)}

/* segmented & chips */
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg .cnt{font-family:var(--f-mono);font-size:11px;margin-left:2px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.3}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.en{font-family:var(--f-en);font-size:14.5px;text-align:left}

/* empty */
.empty{text-align:center;padding:30px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:19px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:34ch;word-break:keep-all}
.stamp{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--margin);border:1.5px solid var(--margin);border-radius:4px;padding:3px 10px;transform:rotate(-4deg)}
.stats{display:flex;gap:20px;justify-content:center;margin:6px 0}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.li-main{flex:1;min-width:0}
.li .en{font-size:17px;line-height:1.35}
.li .lko{font-size:13.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.li .lipa{font-family:var(--f-en);font-size:13px;color:var(--accent);margin-top:1px}
.li-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.st{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.st.new{background:var(--accent-soft);color:var(--accent)}
.st.learning{background:var(--warn-soft);color:var(--warn)}
.st.hard{background:var(--bad-soft);color:var(--bad)}
.st.done{background:var(--good-soft);color:var(--good)}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;padding:4px 8px;color:var(--muted)}
.x.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.mini{width:32px;height:32px;border-radius:8px}
.mini svg{width:16px;height:16px}

/* chat */
.intro h2{font-size:20px;margin:4px 0 4px;text-wrap:balance}
.intro p{margin:0 0 14px;color:var(--muted);font-size:14px;word-break:keep-all}
.sc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{text-align:left;background:var(--p-lav);border-color:transparent!important;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sc:nth-child(6n+2){background:var(--p-mint)}.sc:nth-child(6n+3){background:var(--p-peach)}.sc:nth-child(6n+4){background:var(--p-sky)}.sc:nth-child(6n+5){background:var(--p-pink)}.sc:nth-child(6n){background:var(--p-lemon)}
.sc b{font-size:14.5px}
.sc span{font-size:12px;color:var(--muted);font-family:var(--f-en)}
.custom{display:flex;gap:8px;margin-top:8px}
.custom input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.voicebox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.voicebox .vrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voicebox .vrow label{font-size:13px;font-weight:600;min-width:52px}
.chat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chat-h b{display:block;font-size:16px}
.log{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.bub{max-width:86%;padding:10px 13px 8px;border-radius:15px}
.bub.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:4px;padding-bottom:10px}
.bub .t{font-family:var(--f-en);font-size:17px;line-height:1.4;word-break:break-word}
.bub.me .t{font-family:var(--f-ko);font-size:15px}
.bub .bko{font-size:13.5px;color:var(--muted);margin-top:4px;word-break:keep-all}
.bub-act{display:flex;flex-wrap:wrap;gap:2px;margin:4px -6px 0}
.lnk{border:0;background:transparent;color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 6px;display:inline-flex;align-items:center;gap:4px}
.lnk svg{width:15px;height:15px}
.fb{align-self:flex-end;max-width:86%;background:var(--p-mint);border-radius:10px;padding:9px 12px 6px;font-size:13px}
.fb .eyebrow{color:var(--good)}
.fb .t{font-family:var(--f-en);font-size:16px;line-height:1.4;margin-top:2px}
.fb .why{color:var(--muted);margin-top:2px;word-break:keep-all}
.sug{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.inbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.in{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:15px;line-height:1.45;max-height:130px}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--bad-soft)}}
.send{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 0;text-align:center}

/* translator */
.trbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 4px 10px;margin-bottom:14px}
.in.plain{border:0;background:transparent;width:100%;font-size:17px;padding:12px}
.tr-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px}
.src-line{font-size:13px;color:var(--muted);margin:0 0 10px;word-break:keep-all}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet-h .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.sheet-h h2{margin:0;font-size:19px}
.sheet-b{padding-block:4px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch}
.row .lb{font-weight:600;font-size:14.5px}
.row .ds{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px;word-break:keep-all}
.row select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 8px;max-width:58%;min-width:0}
.tg{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tg:checked{background:var(--accent)}
.tg:checked::after{transform:translateX(18px)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.lvls button b{font-size:16px;color:var(--ink)}
.lvls button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvls button.on b{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1;padding:0}
.stepper b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangehead{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600}
.rangehead span{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 10px;word-break:keep-all}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);width:max-content;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;word-break:keep-all}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.brand span{display:none}.ko{font-size:19.5px}.en{font-size:21px}}
</style>

<div id="app">
  <header class="top"><div class="wrap top-in">
    <div class="brand"><b>말문</b><span>English Talk</span></div>
    <span class="pill" id="net"><i></i><span>확인 중</span></span>
    <button class="lv" id="lvchip" data-act="settings">Lv.2</button>
    <button class="iconbtn" data-act="settings" aria-label="설정" id="gearbtn"></button>
  </div></header>
  <main class="wrap" id="view"><p class="small">불러오는 중…</p></main>
  <nav class="tabs" id="tabs"><div class="wrap"></div></nav>
</div>

var DB=null, cloud='off', dirty=new Set(), flushing=false, flushT=null;

function writeKey(k){
  if(k==='p')return DB.prof.set({settings:S.settings,log:S.log,lastFetch:S.lastFetch,pending:S.pending,scn:S.scn,u:S.u});
  var t=k.charAt(0),id=k.slice(2);
  if(t==='c'&&S.cards[id])return DB.prof.collection('cards').doc(id).set(clone(S.cards[id]));
  if(t==='w'&&S.words[id])return DB.prof.collection('words').doc(id).set(clone(S.words[id]));

}
async function flush(){
  if(!DB||flushing||!dirty.size)return;flushing=true;
  try{while(dirty.size){var k=dirty.values().next().value;dirty.delete(k);
    try{await writeKey(k)}catch(e){var c=e&&e.code;
      if(c==='unavailable'||c==='resource_exhausted'){dirty.add(k);break}
      if(c==='revoked'||c==='not_granted'||c==='capability_disabled'){DB=null;cloud='off';renderChrome();break}
      if(c==='quota_exceeded'){toast('계정 저장 공간이 가득 찼어요. 이 기기에는 계속 저장돼요.');break}

    Object.keys(S.cards).forEach(function(k){var l=S.cards[k];if((l.u||0)>0&&(!rc[k]||(l.u||0)>(rc[k].u||0)))dirty.add('c:'+k)});

function rollLog(){var t=todayStr();if(S.log.date!==t){S.log={date:t,newDone:0,extra:0};touchP()}}
function allCards(){return Object.keys(S.cards).map(function(k){return S.cards[k]}).filter(function(c){return !c.del})}
function dueCards(){var now=Date.now();return allCards().filter(function(c){return c.status==='learning'&&(c.due||0)<=now}).sort(function(a,b){return a.due-b.due})}
function hardCards(){return allCards().filter(function(c){return c.hard&&c.status!=='done'}).sort(function(a,b){return (b.lapses||0)-(a.lapses||0)})}
function allWords(){return Object.keys(S.words).map(function(k){return S.words[k]}).filter(function(w){return !w.del})}
function dueWords(){var now=Date.now();return allWords().filter(function(w){return w.status!=='done'&&(w.due||0)<=now})}
function newLeft(){return allCards().filter(function(c){return c.status==='new'}).length}
function rateCard(c,r){
  var now=Date.now();
  if(c.status==='new'){rollLog();if(!c.prio){S.log.newDone++;touchP()}c.status='learning';c.box=0;c.prio=false}
  c.reps=(c.reps||0)+1;c.last=now;

  else if(r==='mid'){if(!c.hard)c.mid=true;c.due=now+Math.max(INT[0],(INT[c.box||0]||DAY)/2)}
  else{c.box=(c.box||0)+1;c.hard=false;c.mid=false;if(c.box>=5){c.status='done';c.doneAt=now;c.due=0}else c.due=now+INT[c.box]}
  touch(c);
}

  if(r==='hard'){w.box=0;w.due=now+INT[0]}else{w.box=(w.box||0)+1;if(w.box>=4){w.status='done';w.due=0}else w.due=now+INT[w.box]}

function fmtDue(t){if(!t)return '';var d=new Date(t),now=new Date(),diff=t-Date.now();
  var hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(diff<HOUR)return Math.max(1,Math.round(diff/MIN))+'분 후';
  if(d.toDateString()===now.toDateString())return '오늘 '+hm;
  var days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/DAY);
  return days===1?'내일 '+hm:days+'일 후';}

function buildLearn(){
  rollLog();var s=S.settings,lim=Math.max(0,s.daily+(S.log.extra||0)-(S.log.newDone||0)),lv=s.level;
  var news=allCards().filter(function(c){return c.status==='new'});
  var pri=news.filter(function(c){return c.prio}).sort(function(a,b){return (a.added||0)-(b.added||0)});
  var rest=news.filter(function(c){return !c.prio}).sort(function(a,b){return Math.abs(a.level-lv)-Math.abs(b.level-lv)||(a.added||0)-(b.added||0)});
  var now=Date.now();
  var again=allCards().filter(function(c){return c.status==='learning'&&(c.hard||c.mid||(c.src==='variant'&&!c.reps))&&(now-(c.last||0))>=INT[0]})
    .sort(function(a,b){return (b.hard?2:b.mid?1:0)-(a.hard?2:a.mid?1:0)||(b.lapses||0)-(a.lapses||0)||(a.due||0)-(b.due||0)});
  var q=again.concat(pri,rest.slice(0,lim)).map(function(c){return c.id});
  sess={kind:'learn',q:q,i:0,rev:false,again:again.length};
}

  if(!sess||sess.kind!==rkind)buildReview(rkind);
  var src=rkind==='word'?S.words:S.cards;
  while(sess.i<sess.q.length&&(!src[sess.q[sess.i]]||src[sess.q[sess.i]].del))sess.i++;
  if(sess.i>=sess.q.length)return seg+emptyReview();
  var id=sess.q[sess.i];
  if(rkind==='word')return seg+progHTML('단어 복습')+wordBlock(S.words[id]);
  return seg+progHTML(rkind==='hard'?'어려운 문장 집중 연습':'문장 복습')+studyBlock(S.cards[id]);
}
function emptyReview(){

    msg=ws.length?'지금 복습할 단어가 없어요':'킵한 단어가 아직 없어요';}

  return '<div class="empty"><h2>'+msg+'</h2>'+(next?'<p>다음 복습 · '+fmtDue(next)+'</p>':'')+

function chatPrompt(){
  var s=S.settings,L=LEVELS[s.level],cap=[0,12,16,22,26,30][s.level];
  var lines=chat.turns.slice(-16).map(function(t){return (t.who==='ai'?'Partner: ':'Learner: ')+t.t}).join('\n');
  return 'You are a native English speaker role-playing a real spoken conversation so a Korean learner can practice.\n'+
  'Scenario: '+chat.sc.ko+(chat.sc.goal?' (the learner\'s goal: '+chat.sc.goal+')':'')+'. You are '+chat.sc.role+'.\nLearner level: '+s.level+'/5 ('+L.n+': '+L.d+').\n'+
  'How to talk: sound like a real person in this situation — natural, warm and polite everyday speech with contractions; never rude, bossy or sarcastic. Keep each reply to 1-2 short sentences (under '+cap+' words) at the learner\'s level, and usually end with a question or prompt so the learner keeps talking. Stay in the scenario.\n'+
  'If the learner wrote Korean or mixed Korean, understand it, continue naturally, and give the natural English for what they meant in feedback.better.\n'+
  'Feedback: if the learner\'s last line has a mistake, sounds unnatural, or sounds too blunt, set feedback to {"better": a natural polite version they could say, "why": one short Korean sentence explaining}. If it was fine or there is no learner line yet, feedback is null.\n'+
  'Reply with only JSON: {"reply":"your next line in English","reply_ko":"natural Korean translation of your line","feedback":null,"suggest":["2-3 short natural English replies the learner could say next, at their level"]}\n\n'+
  (lines?'Conversation so far:\n'+lines:'Start the conversation now with a natural opening line for this situation.');
}
async function aiTurn(){
  if(!AI){chat.err='AI 대화는 인터넷에 연결된 Claude 앱에서만 쓸 수 있어요.';updChat();return}
  chat.busy=true;chat.err='';updChat();chatCtl=new AbortController();
  try{
    var r=await AI.json(chatPrompt(),{modelTier:'quick',cache:false,signal:chatCtl.signal});
    var reply=str(r&&r.reply);if(!reply)throw {code:'invalid_json'};
    var lastT=chat.turns[chat.turns.length-1];
    if(lastT&&lastT.who==='me'&&r.feedback&&str(r.feedback.better))lastT.fb={better:str(r.feedback.better),why:str(r.feedback.why)};
    chat.turns.push({who:'ai',t:reply,ko:str(r.reply_ko),sug:arr(r.suggest).slice(0,3).map(str).filter(Boolean)});
    if(S.settings.chatSpeak)speak(reply);
  }catch(e){var m=aiFail(e);if(m)chat.err=m}
  finally{chat.busy=false;saveChat();updChat()}
}
function sendChat(){
  var ta=$('#chatIn');var t=str(ta&&ta.value);if(!t||chat.busy)return;
  if(listening){try{rec.stop()}catch(e){}}
  chat.turns.push({who:'me',t:t});chatDraft='';ta.value='';autosize(ta);aiTurn();
}

}

var bk=null;
function exportCode(){return 'MALMUN1:'+JSON.stringify({settings:S.settings,log:S.log,lastFetch:S.lastFetch,pending:S.pending,scn:S.scn,u:S.u,cards:S.cards,words:S.words})}
function bkHTML(){
  if(bk==='out')return '<p class="ds" style="margin:4px 0 0">이 코드를 복사해서 다른 쪽 앱의 설정 → 기록 옮기기 → 가져오기에 붙여 넣으세요.</p><textarea id="bkOut" class="in" rows="4" readonly style="width:100%;font-family:var(--f-mono);font-size:11px">'+h(exportCode())+'</textarea><button class="btn sm primary" data-act="bkcopy">코드 복사</button>';

  return '';
}
function importState(x){
  var n=0;
  Object.keys(x.cards||{}).forEach(function(k){var r=x.cards[k],l=S.cards[k];if(r&&typeof r==='object'&&(!l||(r.u||0)>(l.u||0))){S.cards[k]=r;markDirty('c:'+k);n++}});
  Object.keys(x.words||{}).forEach(function(k){var r=x.words[k],l=S.words[k];if(r&&typeof r==='object'&&(!l||(r.u||0)>(l.u||0))){S.words[k]=r;markDirty('w:'+k);n++}});
  if(x.settings&&(x.u||0)>(S.u||0)){S.settings=Object.assign({},S.settings,x.settings);if(x.log)S.log=x.log;S.lastFetch=Math.max(S.lastFetch||0,x.lastFetch||0);if(Array.isArray(x.pending))S.pending=x.pending;if(x.scn&&Array.isArray(x.scn.list))S.scn=x.scn;S.u=x.u;markDirty('p')}
  else if(x.scn&&Array.isArray(x.scn.list)&&(x.scn.at||0)>((S.scn&&S.scn.at)||0)){S.scn=x.scn;touchP()}
  saveLocal();sess=null;return n;
}
function tgRow(k,lb,ds){return '<div class="row"><div><div class="lb">'+lb+'</div>'+(ds?'<div class="ds">'+ds+'</div>':'')+'</div><input type="checkbox" class="tg" data-set="'+k+'" aria-label="'+lb+'"'+(S.settings[k]?' checked':'')+'></div>'}
function openSheet(){renderSheet();$('#sheet').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';render()}

/* ---------- offline file ---------- */
async function saveOffline(){
  var c=window.claude,dl=null;try{dl=c&&c.use?await c.use('downloads'):null}catch(e){}
  if(!dl){toast('이 화면에서는 파일 저장을 지원하지 않아요.');return}
  var seed=JSON.stringify(S).replace(/</g,'\\u003c');

  var html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'+body+'</body></html>';
  try{await dl.save({filename:'malmun-english.html',data:html});toast('저장했어요. 파일 앱에서 브라우저로 열면 오프라인으로 쓸 수 있어요.')}
  catch(e){if(e&&e.code!=='declined')toast('파일을 저장하지 못했어요.')}

/* ---------- events ---------- */
function ctxWords(ctx){
  if(ctx==='tr'&&tr.res)return {words:arr(tr.res.words).map(function(w){return {w:str(w.w),ipa:fixIpa(w.ipa),pos:str(w.pos),ko:str(w.ko)}}).filter(function(w){return w.w&&w.ko}),ex:tr.res.en,exKo:tr.res.ko};
  if(ctx.indexOf('c:')===0){var c=S.cards[ctx.slice(2)];if(c)return {words:c.words||[],ex:c.en,exKo:c.ko}}
  return null}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a!=='del'&&delArm){delArm=null;if(view==='words'&&a!=='speak'){}}
  switch(a){
  case 'go':view=b.dataset.v;if(view!=='review'&&sess&&sess.kind!=='learn')sess=null;if(view==='review'||view==='learn')sess=null;closeIfOpen();render();window.scrollTo(0,0);break;
  case 'settings':openSheet();break;
  case 'closesheet':closeSheet();break;
  case 'reveal':sess.rev=true;render();if(S.settings.autoSpeak){var it=view==='review'&&rkind==='word'?S.words[sess.q[sess.i]]:S.cards[sess.q[sess.i]];if(it)speak(it.en||it.w)}break;
  case 'rate':{var c=S.cards[sess.q[sess.i]];if(!c)break;var r=b.dataset.r;rateCard(c,r);
    if(r==='hard'){requeue(c.id,3);var v=addBuiltinVariant(c);if(v){requeue(v.id,1);toast('비슷한 문장을 바로 뒤에 넣었어요')}
      if(!c.vAi)genVariants(c).then(function(ok){if(ok)renderChrome()})}
    else if(r==='mid'&&c.box===0&&sess.kind!=='hard')requeue(c.id,4);
    sess.i++;sess.rev=false;render();window.scrollTo(0,0);break;}
  case 'wrate':{var w=S.words[sess.q[sess.i]];if(!w)break;rateWord(w,b.dataset.r);if(b.dataset.r==='hard')requeue(w.id,3);sess.i++;sess.rev=false;render();window.scrollTo(0,0);break;}
  case 'speak':speak(b.dataset.text,b.dataset.slow?Math.max(0.5,S.settings.rate-0.3):0);break;
  case 'keep':{var cw=ctxWords(b.dataset.ctx);if(!cw)break;var wd=cw.words[+b.dataset.i];if(!wd)break;var k=wkey(wd.w),ex=S.words[k];
    if(ex&&!ex.del){ex.del=true;touchW(ex);b.classList.remove('on');b.setAttribute('aria-pressed','false');toast('단어장에서 뺐어요')}
    else{var nw={id:k,w:wd.w,ipa:wd.ipa,pos:wd.pos,ko:wd.ko,ex:cw.ex,exKo:cw.exKo,box:0,due:Date.now()+INT[0],status:'learning',added:Date.now(),del:false};S.words[k]=nw;touchW(nw);b.classList.add('on');b.setAttribute('aria-pressed','true');toast('단어장에 킵했어요. 계속 학습하세요!')}
    renderChrome();break;}
  case 'more':S.log.extra=(S.log.extra||0)+5;touchP();sess=null;render();if(AI&&freshCount()<15)fetchNew(10,false);break;
  case 'fetch':fetchNew(10,true);if(!$('#sheet').hidden)renderSheet();break;
  case 'rkind':rkind=b.dataset.k;sess=null;render();break;
  case 'wkind':wkind=b.dataset.k;render();break;
  case 'sfilter':sfilter=b.dataset.k;render();break;
  case 'del':{var kk=b.dataset.k;if(delArm!==kk){delArm=kk;render();break}delArm=null;
    var item=kk.charAt(0)==='c'?S.cards[kk.slice(2)]:S.words[kk.slice(2)];if(item){item.del=true;if(kk.charAt(0)==='c')touch(item);else touchW(item)}sess=null;render();toast('삭제했어요');break;}
  case 'scnfetch':fetchScenes(true);break;
  case 'chatstart':{var sc=SCN.concat(S.scn&&S.scn.list||[]).find(function(x){return x.id===b.dataset.id});if(!sc)break;startChat(sc);break;}
  case 'chatcustom':{var v2=str($('#scIn')&&$('#scIn').value);if(!v2){toast('상황을 입력해 주세요.');break}startChat({id:'custom',ko:v2,en:'',role:'the most natural conversation partner for this situation: '+v2});break;}
  case 'chatnew':if(chatCtl)chatCtl.abort();chat={sc:null,turns:[],busy:false,err:''};showKo={};saveChat();render();break;
  case 'chatretry':aiTurn();break;
  case 'send':sendChat();break;
  case 'mic':toggleMic();break;
  case 'koToggle':showKo[b.dataset.i]=!showKo[b.dataset.i];updChat();break;
  case 'usesug':{var ta=$('#chatIn');if(ta){ta.value=b.dataset.text;chatDraft=ta.value;autosize(ta);ta.focus()}speak(b.dataset.text);break;}
  case 'chatsave':saveSentence(b.dataset.text,'en','chat',b);break;
  case 'trdir':if(tr.dir!==b.dataset.d){tr.dir=b.dataset.d;tr.res=null;tr.err='';tr.text='';}render();break;
  case 'translate':doTranslate();break;
  case 'trsave':if(tr.res&&!tr.saved){var c2=saveAsCard(tr.res,'trans');if(c2){tr.saved=true;toast('학습 탭에 추가했어요. 다음 학습에 바로 나와요.');render()}}break;
  case 'level':setS('level',+b.dataset.n);sess=null;renderSheet();renderChrome();if(AI&&S.settings.autoUpdate&&freshCount()<S.settings.daily)fetchNew(8,false);break;
  case 'daily':setS('daily',Math.max(3,Math.min(30,S.settings.daily+(+b.dataset.d))));sess=null;renderSheet();break;
  case 'topic':{var t=b.dataset.t,ts=S.settings.topics.slice(),ix=ts.indexOf(t);if(ix>=0){if(ts.length>1)ts.splice(ix,1);else{toast('주제는 하나 이상 골라 주세요.');break}}else ts.push(t);setS('topics',ts);renderSheet();break;}
  case 'addtopic':{var nt=str($('#topicIn')&&$('#topicIn').value);if(!nt)break;if(S.settings.topics.indexOf(nt)<0){setS('topics',S.settings.topics.concat([nt]))}renderSheet();break;}
  case 'gender':setS('gender',b.dataset.g);setS('voiceURI','');refreshVoiceUI();speak(b.dataset.g==='male'?'Hi, nice to meet you.':'Hi, nice to meet you.');break;
  case 'accent':setS('accent',b.dataset.a);setS('voiceURI','');refreshVoiceUI();break;
  case 'offline':saveOffline();break;
  case 'bkout':bk=bk==='out'?null:'out';renderSheet();break;
  case 'bkin':bk=bk==='in'?null:'in';renderSheet();break;
  case 'bkcopy':{var ta2=$('#bkOut');var code=exportCode();
    var fallback=function(){if(ta2){ta2.focus();ta2.select();try{document.execCommand('copy');toast('코드를 복사했어요')}catch(_){toast('코드를 길게 눌러 전체 선택 후 복사해 주세요.')}}};
    try{navigator.clipboard.writeText(code).then(function(){toast('코드를 복사했어요')},fallback)}catch(_){fallback()}break;}
  case 'bkmerge':{var raw=str($('#bkIn')&&$('#bkIn').value);var x=null;
    if(raw.indexOf('MALMUN1:')===0){try{x=JSON.parse(raw.slice(8))}catch(_){x=null}}
    if(!x||typeof x!=='object'||!x.cards){toast('코드가 올바르지 않아요. 처음부터 끝까지 전부 붙여 넣었는지 확인해 주세요.');break}
    var n=importState(x);bk=null;renderSheet();renderChrome();toast(n?'기록 '+n+'개를 합쳤어요':'이미 최신 기록이에요');break;}
  }
});
function refreshVoiceUI(){if(!$('#sheet').hidden)renderSheet();if(view==='chat'&&!chat.sc)render()}
function closeIfOpen(){if(!$('#sheet').hidden){$('#sheet').hidden=true;document.body.style.overflow=''}}

document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.set){setS(t.dataset.set,!!t.checked);if(t.dataset.set==='autoUpdate'&&t.checked&&AI)autoUpdate();return}
  if(t.id==='voiceSel'){setS('voiceURI',t.value);var p=pickVoice();speak('Hi! This is how I sound.');return}
  if(t.id==='rateIn'||t.id==='rateIn2'){setS('rate',+t.value)}
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='rateIn'||t.id==='rateIn2'){var v=+t.value;S.settings.rate=v;['#rateVal','#rateVal2'].forEach(function(s){var el=$(s);if(el)el.textContent=v.toFixed(2)+'×'})}

  if(t.id==='trIn'){tr.text=t.value;autosize(t)}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}

});

rollLog();render();

initAI();initCloud();
})();
